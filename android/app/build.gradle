plugins {
    id "com.android.application"
}

android {
    namespace "ru.dnevnik.app"
    compileSdk 34

    defaultConfig {
        applicationId "ru.dnevnik.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile file("dnevnik.keystore")
            storePassword "dnevnik-install"
            keyAlias "dnevnik"
            keyPassword "dnevnik-install"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
